name: Remove unsupported speech phrases

on:
  push:
    branches:
      - agent/remove-speech-phrases
    paths:
      - '.github/workflows/remove-unsupported-speech-phrases.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-speech-phrases
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove unsupported contextual phrases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          start = s.index('    if (mode === "vendor") {\n      const vendorTerms =')
          end = s.index('    recognition.onstart = () => {', start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/remove-unsupported-speech-phrases.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/remove-unsupported-speech-phrases.yml
          git commit -m "Remove unsupported speech phrase bias"
          git push origin HEAD:agent/remove-speech-phrases
