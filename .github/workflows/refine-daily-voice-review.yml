name: Refine daily voice review
on:
  push:
    branches: [agent/daily-cash-voice-review-flow-impl]
    paths:
      - '.github/scripts/refine_daily_voice_review.py'
      - '.github/workflows/refine-daily-voice-review.yml'
permissions:
  contents: write
jobs:
  refine-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-cash-voice-review-flow-impl
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refine source
        run: python .github/scripts/refine_daily_voice_review.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Remove temporary files
        run: rm .github/scripts/refine_daily_voice_review.py .github/workflows/refine-daily-voice-review.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine daily voice review flow'
          git push origin HEAD:agent/daily-cash-voice-review-flow-impl
