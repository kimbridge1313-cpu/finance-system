name: Split vendor and date voice input

on:
  push:
    branches:
      - agent/vendor-speech-bias
    paths:
      - '.github/workflows/split-vendor-date-voice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vendor-speech-bias
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 .github/scripts/split_vendor_date_voice.py
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit result
        run: |
          rm .github/workflows/split-vendor-date-voice.yml
          rm .github/scripts/split_vendor_date_voice.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/split-vendor-date-voice.yml .github/scripts/split_vendor_date_voice.py
          git commit -m "Split vendor and date voice recognition"
          git push origin HEAD:agent/vendor-speech-bias
