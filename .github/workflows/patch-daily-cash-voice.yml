name: Patch daily cash voice quick entry

on:
  push:
    branches:
      - agent/daily-cash-voice-quick-entry

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-cash-voice-quick-entry
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch App
        run: python .github/scripts/patch_daily_cash_voice.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Remove temporary patch files
        run: rm -f .github/scripts/patch_daily_cash_voice.py .github/workflows/patch-daily-cash-voice.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add quick voice entry to daily cash" || exit 0
          git push origin HEAD:agent/daily-cash-voice-quick-entry
