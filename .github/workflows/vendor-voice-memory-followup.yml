name: Refine vendor voice memory

on:
  push:
    branches:
      - agent/vendor-voice-memory
    paths:
      - '.github/workflows/vendor-voice-memory-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vendor-voice-memory
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply follow-up patch
        run: python3 .github/scripts/vendor_voice_memory_followup.py
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit patch
        run: |
          rm .github/workflows/vendor-voice-memory-followup.yml
          rm .github/scripts/vendor_voice_memory_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/vendor-voice-memory-followup.yml .github/scripts/vendor_voice_memory_followup.py
          git commit -m "Refine vendor voice memory matching"
          git push origin HEAD:agent/vendor-voice-memory
