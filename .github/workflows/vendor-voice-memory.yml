name: Add vendor voice memory

on:
  push:
    branches:
      - agent/vendor-voice-memory
    paths:
      - '.github/workflows/vendor-voice-memory.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vendor-voice-memory
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch voice memory
        run: python3 .github/scripts/vendor_voice_memory.py
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit patch
        run: |
          rm .github/workflows/vendor-voice-memory.yml
          rm .github/scripts/vendor_voice_memory.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/vendorBillVoice.js .github/workflows/vendor-voice-memory.yml .github/scripts/vendor_voice_memory.py
          git commit -m "Add vendor voice alias memory"
          git push origin HEAD:agent/vendor-voice-memory
