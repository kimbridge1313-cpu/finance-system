name: Patch vendor bill voice input

on:
  push:
    branches:
      - agent/vendor-bills-voice-input
    paths:
      - .github/workflows/patch-vendor-bill-voice.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vendor-bills-voice-input
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch App.jsx
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/App.jsx")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'import liff from "@line/liff";\n',
              'import liff from "@line/liff";\nimport { getMonthDefaultRange, getSpeechRecognitionConstructor, isSpeechRecognitionSupported, parseVendorBillVoice } from "./vendorBillVoice.js";\n',
              "voice helper import",
          )

          old_form = '''  const defaultBillMonth = getTodayDate().slice(0, 7);\n  const [form, setForm] = useState({ billMonth: defaultBillMonth, vendorId: defaultVendor?.id || "", vendorCode: defaultVendor?.vendorCode || "", vendorName: defaultVendor?.vendorName || "", department: defaultVendor?.department || departments[0]?.value || "", deductPercent: getDeductRule(defaultVendor) || "", startDate: `${defaultBillMonth}-01`, endDate: `${defaultBillMonth}-31`, note: "", billTotal: "", paymentMethod: "現金", checkNumber: "", ticketStatus: "none" });'''
          new_form = '''  const defaultBillMonth = getTodayDate().slice(0, 7);\n  const defaultBillRange = getMonthDefaultRange(defaultBillMonth);\n  const [form, setForm] = useState({ billMonth: defaultBillMonth, vendorId: defaultVendor?.id || "", vendorCode: defaultVendor?.vendorCode || "", vendorName: defaultVendor?.vendorName || "", department: defaultVendor?.department || departments[0]?.value || "", deductPercent: getDeductRule(defaultVendor) || "", startDate: defaultBillRange.startDate, endDate: defaultBillRange.endDate, note: "", billTotal: "", paymentMethod: "現金", checkNumber: "", ticketStatus: "none" });'''
          replace_once(old_form, new_form, "default bill range")

          replace_once(
              '  const [drafts, setDrafts] = useState({});\n\n  function getBillMonth(bill)',
              '''  const [drafts, setDrafts] = useState({});\n  const [voiceListening, setVoiceListening] = useState(false);\n  const [voiceTranscript, setVoiceTranscript] = useState("");\n  const [voiceMessage, setVoiceMessage] = useState("");\n  const [voiceCandidates, setVoiceCandidates] = useState([]);\n  const speechSupported = isSpeechRecognitionSupported();\n\n  function getBillMonth(bill)''',
              "voice states",
          )

          old_update = '''  function updateForm(field, value) { if (field === "vendorId") { const vendor = monthlyVendors.find((v) => v.id === value); setForm((p) => ({ ...p, vendorId: value, vendorCode: vendor?.vendorCode || "", vendorName: vendor?.vendorName || "", department: vendor?.department || "", deductPercent: getDeductRule(vendor) || "" })); } else if (field === "billMonth") { setForm((p) => ({ ...p, billMonth: value })); } else setForm((p) => paymentDefaults({ ...p, [field]: value })); }'''
          new_update = '''  function updateForm(field, value) {\n    if (field === "vendorId") {\n      const vendor = monthlyVendors.find((v) => v.id === value);\n      setForm((p) => ({ ...p, vendorId: value, vendorCode: vendor?.vendorCode || "", vendorName: vendor?.vendorName || "", department: vendor?.department || "", deductPercent: getDeductRule(vendor) || "" }));\n    } else if (field === "billMonth") {\n      const range = getMonthDefaultRange(value);\n      setForm((p) => ({ ...p, billMonth: value, startDate: range.startDate, endDate: range.endDate }));\n      setFilterMonth(value);\n    } else {\n      setForm((p) => paymentDefaults({ ...p, [field]: value }));\n    }\n  }\n\n  function selectVoiceVendor(vendor) {\n    if (!vendor?.id) return;\n    updateForm("vendorId", vendor.id);\n    setVoiceCandidates([]);\n    setVoiceMessage(`已帶入廠商：${vendor.vendorCode ? `${vendor.vendorCode}｜` : ""}${vendor.vendorName}`);\n  }\n\n  function applyVoiceTranscript(transcript) {\n    const result = parseVendorBillVoice({ transcript, billMonth: form.billMonth, vendors: monthlyVendors });\n    setVoiceTranscript(result.transcript);\n    setVoiceCandidates(result.candidates || []);\n\n    const applied = [];\n    if (result.vendor?.id) {\n      updateForm("vendorId", result.vendor.id);\n      applied.push(`廠商 ${result.vendor.vendorName}`);\n    }\n    if (result.startDate) {\n      updateForm("startDate", result.startDate);\n      applied.push(`開始 ${result.startDate}`);\n    }\n    if (result.endDate) {\n      updateForm("endDate", result.endDate);\n      applied.push(`結束 ${result.endDate}`);\n    }\n\n    if (result.candidates?.length) {\n      setVoiceMessage("找到多個可能的廠商，請點選正確廠商。");\n    } else if (applied.length) {\n      setVoiceMessage(`已帶入：${applied.join("、")}`);\n    } else {\n      setVoiceMessage("有聽到內容，但沒有辨識到月結廠商或日期，請再說一次或使用手動輸入。");\n    }\n  }\n\n  function startVoiceInput() {\n    const SpeechRecognition = getSpeechRecognitionConstructor();\n    if (!SpeechRecognition) {\n      setVoiceMessage("目前這個瀏覽器不支援語音辨識，請使用手動搜尋，或改用支援語音辨識的瀏覽器開啟。");\n      return;\n    }\n\n    const recognition = new SpeechRecognition();\n    recognition.lang = "zh-TW";\n    recognition.continuous = false;\n    recognition.interimResults = false;\n    recognition.maxAlternatives = 1;\n    recognition.onstart = () => {\n      setVoiceListening(true);\n      setVoiceMessage("正在聽，請說廠商名稱與日期…");\n      setVoiceCandidates([]);\n    };\n    recognition.onresult = (event) => {\n      const transcript = event.results?.[0]?.[0]?.transcript || "";\n      applyVoiceTranscript(transcript);\n    };\n    recognition.onerror = (event) => {\n      const permissionDenied = event.error === "not-allowed" || event.error === "service-not-allowed";\n      setVoiceMessage(permissionDenied ? "麥克風權限未開啟，請允許麥克風後再試一次。" : `語音辨識失敗：${event.error || "unknown"}`);\n    };\n    recognition.onend = () => setVoiceListening(false);\n\n    try {\n      recognition.start();\n    } catch (error) {\n      setVoiceListening(false);\n      setVoiceMessage(`無法啟動語音辨識：${error?.message || "unknown"}`);\n    }\n  }'''
          replace_once(old_update, new_update, "updateForm and voice handlers")

          old_ui = '''<Card className="space-y-4"><Field label="結算月份"><Input type="month" value={form.billMonth} onChange={(e) => updateForm("billMonth", e.target.value)} /></Field><Field label="月結廠商">'''
          new_ui = '''<Card className="space-y-4"><Field label="結算月份"><Input type="month" value={form.billMonth} onChange={(e) => updateForm("billMonth", e.target.value)} /></Field><div className="rounded-3xl bg-[#06C755]/10 p-4"><div className="flex items-center justify-between gap-3"><div><p className="font-black text-gray-950">語音快速帶入</p><p className="mt-1 text-xs font-bold leading-5 text-gray-500">先選結算月份，再說「大成，7月26號到8月25號」或只說「開始7月26號，結束8月25號」。</p></div><button type="button" onClick={startVoiceInput} disabled={voiceListening || !speechSupported} className={`shrink-0 rounded-2xl px-4 py-3 text-sm font-black ${voiceListening ? "bg-red-500 text-white" : speechSupported ? "bg-[#06C755] text-white" : "bg-gray-200 text-gray-400"}`}>{voiceListening ? "聆聽中…" : "🎙 開始說話"}</button></div>{!speechSupported && <p className="mt-3 rounded-2xl bg-white/80 p-3 text-xs font-bold leading-5 text-gray-500">目前這個瀏覽器沒有提供語音辨識；月結廠商搜尋與日期手動輸入仍可正常使用。</p>}{voiceTranscript && <div className="mt-3 rounded-2xl bg-white/80 p-3"><p className="text-[11px] font-black uppercase tracking-wider text-gray-400">辨識內容</p><p className="mt-1 text-sm font-bold text-gray-700">{voiceTranscript}</p></div>}{voiceMessage && <p className="mt-3 text-xs font-black leading-5 text-[#069648]">{voiceMessage}</p>}{voiceCandidates.length > 0 && <div className="mt-3 flex flex-wrap gap-2">{voiceCandidates.map((vendor) => <button key={vendor.id} type="button" onClick={() => selectVoiceVendor(vendor)} className="rounded-full border border-[#06C755]/30 bg-white px-3 py-2 text-xs font-black text-[#069648]">{vendor.vendorCode ? `${vendor.vendorCode}｜` : ""}{vendor.vendorName}</button>)}</div>}</div><Field label="月結廠商">'''
          replace_once(old_ui, new_ui, "voice input UI")

          path.write_text(text)
          Path(".github/workflows/patch-vendor-bill-voice.yml").unlink()
          PY

      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/patch-vendor-bill-voice.yml
          git commit -m "Add voice input to vendor bills"
          git push origin agent/vendor-bills-voice-input
