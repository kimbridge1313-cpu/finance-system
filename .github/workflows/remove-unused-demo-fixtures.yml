name: Remove unused business demo fixtures

on:
  push:
    branches:
      - agent/generalize-deployment-settings
    paths:
      - .github/workflows/remove-unused-demo-fixtures.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          text = path.read_text()
          pattern = re.compile(r'\nconst initialDailyCash = \{.*?\nfunction getTodayDate', re.S)
          text, count = pattern.subn('\nfunction getTodayDate', text, count=1)
          if count != 1:
            raise SystemExit(f'Expected one demo fixture block, removed {count}')

          marker = 'const DEFAULT_DEPARTMENTS = ['
          comment = '// Legacy compatibility fallback for the existing production deployment.\n// New deployments receive departments and categories from /api/bootstrap and Firestore.\n'
          if comment not in text:
            text = text.replace(marker, comment + marker, 1)

          path.write_text(text)
          Path('.github/workflows/remove-unused-demo-fixtures.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/remove-unused-demo-fixtures.yml
          git commit -m "Remove unused business demo fixtures"
          git push origin HEAD:agent/generalize-deployment-settings
