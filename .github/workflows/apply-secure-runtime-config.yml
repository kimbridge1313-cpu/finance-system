name: Apply secure runtime config migration

on:
  push:
    branches:
      - agent/secure-runtime-config

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/secure-runtime-config
          fetch-depth: 0

      - name: Move client configuration to Vercel environment variables
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app_path = Path("src/App.jsx")
          source = app_path.read_text(encoding="utf-8")

          old_config = '''// ============================================================================
          // 正式部署連線設定
          // ---------------------------------------------------------------------------
          // 這份檔案可以直接覆蓋 GitHub 的 src/App.jsx。
          // Firebase Web Config 可以公開在前端；Service Account 私鑰只放 Vercel Environment Variables。
          // LINE userId 正式版由 liff.getProfile().userId 動態取得，不寫死。
          // ============================================================================
          const firebaseConfig = {
            apiKey: "AIzaSyDolam_OIhFPGFlgibKcs1U8gr6KQXfplg",
            authDomain: "finance-system-52d62.firebaseapp.com",
            projectId: "finance-system-52d62",
            storageBucket: "finance-system-52d62.firebasestorage.app",
            messagingSenderId: "517046288884",
            appId: "1:517046288884:web:20f6b4af7f44bcef1479a1",
          };

          // TODO：請把這裡改成你 LINE Developers 取得的 LIFF ID。
          const LIFF_ID = "2010101193-M9eYhgFD";
          const AUTH_ENDPOINT = "/api/auth";'''

          new_config = '''// ============================================================================
          // 正式部署連線設定
          // ---------------------------------------------------------------------------
          // 所有部署差異均由 Vercel Environment Variables 提供，GitHub 只保留程式碼與變數名稱。
          // 注意：VITE_* 變數會被打包至瀏覽器，適合 Firebase Web Config 與 LIFF ID，不能存放私鑰。
          // FIREBASE_SERVICE_ACCOUNT 屬於伺服器端機密，只能放在 Vercel，且不得使用 VITE_ 前綴。
          // ============================================================================
          const runtimeEnv = import.meta.env;

          const firebaseConfig = {
            apiKey: runtimeEnv.VITE_FIREBASE_API_KEY,
            authDomain: runtimeEnv.VITE_FIREBASE_AUTH_DOMAIN,
            projectId: runtimeEnv.VITE_FIREBASE_PROJECT_ID,
            storageBucket: runtimeEnv.VITE_FIREBASE_STORAGE_BUCKET,
            messagingSenderId: runtimeEnv.VITE_FIREBASE_MESSAGING_SENDER_ID,
            appId: runtimeEnv.VITE_FIREBASE_APP_ID,
          };

          const LIFF_ID = runtimeEnv.VITE_LINE_LIFF_ID;
          const AUTH_ENDPOINT = runtimeEnv.VITE_AUTH_ENDPOINT || "/api/auth";

          const requiredRuntimeEnv = {
            VITE_FIREBASE_API_KEY: firebaseConfig.apiKey,
            VITE_FIREBASE_AUTH_DOMAIN: firebaseConfig.authDomain,
            VITE_FIREBASE_PROJECT_ID: firebaseConfig.projectId,
            VITE_FIREBASE_STORAGE_BUCKET: firebaseConfig.storageBucket,
            VITE_FIREBASE_MESSAGING_SENDER_ID: firebaseConfig.messagingSenderId,
            VITE_FIREBASE_APP_ID: firebaseConfig.appId,
            VITE_LINE_LIFF_ID: LIFF_ID,
          };

          const missingRuntimeEnv = Object.entries(requiredRuntimeEnv)
            .filter(([, value]) => !String(value || "").trim())
            .map(([name]) => name);

          if (missingRuntimeEnv.length) {
            throw new Error(`缺少必要環境變數：${missingRuntimeEnv.join(", ")}`);
          }'''

          if old_config not in source:
            raise SystemExit("Expected connection configuration block was not found; no file was changed.")

          source = source.replace(old_config, new_config, 1)
          source = source.replace(
            'if (!LIFF_ID || LIFF_ID === "請填入_LINE_LIFF_ID") throw new Error("尚未設定 LIFF ID，請先在 src/App.jsx 填入 LIFF_ID。");',
            'if (!LIFF_ID) throw new Error("尚未設定 LIFF ID，請先在 Vercel 設定 VITE_LINE_LIFF_ID。");',
            1,
          )
          source = source.replace(
            '{ name: "Firebase projectId 已接入", pass: firebaseConfig.projectId === "finance-system-52d62" },',
            '{ name: "Firebase projectId 已設定", pass: Boolean(firebaseConfig.projectId) },',
            1,
          )

          app_path.write_text(source, encoding="utf-8")
          PY

          cat > .env.example <<'EOF'
          # Browser-exposed Vite configuration (set in Vercel for Preview and Production)
          VITE_FIREBASE_API_KEY=
          VITE_FIREBASE_AUTH_DOMAIN=
          VITE_FIREBASE_PROJECT_ID=
          VITE_FIREBASE_STORAGE_BUCKET=
          VITE_FIREBASE_MESSAGING_SENDER_ID=
          VITE_FIREBASE_APP_ID=
          VITE_LINE_LIFF_ID=
          VITE_AUTH_ENDPOINT=/api/auth

          # Server-only secret. Never use a VITE_ prefix and never commit the value.
          FIREBASE_SERVICE_ACCOUNT=
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          .vercel/

          .env
          .env.*
          !.env.example

          .DS_Store
          *.log
          EOF

          mkdir -p docs
          cat > docs/VERCEL_ENV_SETUP.md <<'EOF'
          # Vercel environment setup

          Configure these values in **Vercel → Project Settings → Environment Variables** before merging this branch.

          ## Browser configuration

          Add each variable to both **Preview** and **Production**:

          - `VITE_FIREBASE_API_KEY`
          - `VITE_FIREBASE_AUTH_DOMAIN`
          - `VITE_FIREBASE_PROJECT_ID`
          - `VITE_FIREBASE_STORAGE_BUCKET`
          - `VITE_FIREBASE_MESSAGING_SENDER_ID`
          - `VITE_FIREBASE_APP_ID`
          - `VITE_LINE_LIFF_ID`
          - `VITE_AUTH_ENDPOINT` (normally `/api/auth`)

          Vite embeds `VITE_*` values in the browser bundle. They keep deployment configuration out of GitHub source files, but they are not server-side secrets.

          ## Server-only secret

          Keep `FIREBASE_SERVICE_ACCOUNT` in Vercel only. Do not prefix it with `VITE_`, do not commit its value, and do not expose it to client code.

          ## Safe rollout order

          1. Add all variables to Vercel Preview.
          2. Redeploy the pull-request preview.
          3. Verify LINE login, `/api/auth`, Firestore reads, and one non-destructive test record.
          4. Add or verify the same variables in Vercel Production.
          5. Merge only after the preview passes.
          6. Confirm the production deployment, then remove any obsolete deployment configuration.
          EOF

      - name: Verify configuration was removed from source
        shell: bash
        run: |
          ! grep -R "AIzaSyDolam_OIhFPGFlgibKcs1U8gr6KQXfplg" src api --exclude-dir=.git
          ! grep -R "2010101193-M9eYhgFD" src api --exclude-dir=.git
          grep -q "VITE_FIREBASE_PROJECT_ID" src/App.jsx
          grep -q "VITE_LINE_LIFF_ID" src/App.jsx

      - name: Build with non-production test values
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: build-check-api-key
          VITE_FIREBASE_AUTH_DOMAIN: build-check.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: build-check
          VITE_FIREBASE_STORAGE_BUCKET: build-check.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: "1:123456789:web:buildcheck"
          VITE_LINE_LIFF_ID: "1234567890-buildcheck"
          VITE_AUTH_ENDPOINT: /api/auth
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Commit migration to isolated branch
        shell: bash
        run: |
          rm -f .github/workflows/apply-secure-runtime-config.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move runtime configuration to Vercel env"
          git push origin HEAD:agent/secure-runtime-config
